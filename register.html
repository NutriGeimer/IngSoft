<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SignUp - BeeParking</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/assets/css/styles.css">
</head>
<body class="auth-page">


  <!--Esta es la barra de menu-->
  
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
    <div class="container">
      <a class="navbar-brand fw-bold" href="./dashboard.html">
        <i class="bi bi-buildings me-2"></i>
        CityInsight
      </a>

      <div class="d-flex align-items-center gap-2 ms-auto">
        <span class="text-white small d-none d-md-inline">
          <i class="bi bi-person-circle me-1"></i>
          <span id="navUserName">Usuario</span>
        </span>
        <button id="logoutBtn" class="btn btn-outline-light btn-sm">
          <i class="bi bi-box-arrow-right me-1"></i>
          Cerrar sesión
        </button>
      </div>
    </div>
  </nav>
    <!--Fin barra de menu-->




  <main class="min-vh-100 d-flex align-items-center justify-content-center auth-wrapper">
    <div class="container">
      
      <div class="row justify-content-center">
        <div class="col-12 col-sm-11 col-md-9 col-lg-6">
            <div class="card-body p-4 p-md-5">
              <div class="text-center mb-4">
      
                
                </div>
                <h1 class="h3 fw-bold mb-2">Crea tu cuenta</h1>
                <p class="text-secondary mb-0">
                  Ingresa tus datos para iniciar beeParkeo
                </p>
              </div>

              <div id="registerAlert" class="alert alert-danger d-none" role="alert"></div>
              <div id="registerSuccess" class="alert alert-success d-none" role="alert"></div>

              <form id="registerForm" novalidate>
                
                <div class="mb-3">
                  
                  <label for="name" class="form-label">NOMBRE COMPLETO</label>
                  
                  <input
                    type="text"
                    class="form-control form-control-lg "
                    id="name"
                    
                    placeholder="Enrique Bunbury"
                    required
                  >     
                  
                </div>

                <div class="mb-3">
                  <label for="email" class="form-label">DIRECCION DE EMAIL</label>
                  <input
                    type="email"
                    class="form-control form-control-lg"
                    id="email"
                    placeholder="ejemplo@correo.com"
                    required
                  >
                </div>
  

                <div class="mb-3">
                  <label for="plates" class="form-label">PLACAS VEHICULARES</label>
                  <input
                    type="text"
                    class="form-control form-control-lg"
                    id="plates"
                    placeholder="Ej. GTF235F"
                  >
                </div>

                <div class="mb-3">
                  <label for="password" class="form-label">CONTRASEÑA</label>
                  <input
                    type="password"
                    class="form-control form-control-lg"
                    id="password"
                    placeholder="Mínimo 6 caracteres"
                    required
                  >
                </div>

                <div class="mb-3">
                  <label for="confirmPassword" class="form-label">CONFIRMAR CONTRASEÑA</label>
                  <input
                    type="password"
                    class="form-control form-control-lg"
                    id="confirmPassword"
                    placeholder="Repite tu contraseña"
                    required
                  >
                </div>

                <div class="d-grid mb-3">
                  <button type="submit" id="registerBtn" class="btn btn-success btn-lg">
                    <i class="bi bi-person-check me-2"></i>
                    Crear cuenta
                  </button>
                </div>

                <div class="text-center">
                  <p class="mb-0 text-secondary">
                    ¿Ya tienes cuenta?
                    <a id="linkLogin" href="./login.html" class="fw-semibold text-decoration-none">Inicia sesión</a>
                  </p>
                </div>
              </form>
            </div>
          </div>

          <p class="text-center text-white-50 mt-3 mb-0 small">
            CityInsight · Plataforma Inteligente de Información Ciudadana
          </p>
        </div>
      </div>
    </div>
  </main>

  <script type="module" src="./assets/js/register.js"></script>
</body>
</html>
