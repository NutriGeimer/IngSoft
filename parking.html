<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BeeParking</title>
    <link rel="stylesheet" href="assets/css/styles.css" />
  </head>
  <body>
    <main class="parking-page">
      <section class="parking-header">
        <h1 class="parking-title">BeeParking</h1>
        <p class="parking-intro">
          Bienvenido a BeeParking. Selecciona tu cajón.
        </p>
      </section>

      <!-- Banner visible solo cuando se llega desde un QR -->
      <div id="qrBanner" class="hidden" style="
        background: #fffbea;
        border: 1.5px solid #f59e0b;
        border-radius: 0.75rem;
        padding: 0.85rem 1.25rem;
        margin-bottom: 1.25rem;
        display: flex;
        align-items: center;
        gap: 0.75rem;
        font-weight: 600;
        color: #92400e;
      ">
        <span style="font-size:1.4rem;">🅿️</span>
        <span id="qrBannerText">Tu cajón asignado:</span>
      </div>

      <div class="parking-layout">
        <div class="parking-map-card">
          <div class="status-label">
            <span class="status-chip free"></span> Libre
          </div>
          <div class="status-label">
            <span class="status-chip occupied"></span> Ocupado
          </div>

          <div id="parkingMap" class="parking-grid" aria-label="Mapa de lugares de estacionamiento"></div>

            <!-- Este boton solo sera una para vista de administrador --> 
          <div class="parking-actions">
            <button id="resetButton" class="btn btn-secondary" type="button">Reiniciar estados</button>
          </div>
        </div>

        <div class="parking-summary-card">
          <h2>Resumen del estacionamiento</h2>
          <p id="currentUserInfo">Usuario en sesión: N/A</p>
          <p id="selectedSpotInfo">Ningún cajón seleccionado</p>

          <ul class="parking-summary-list">
            <li>
              <span>Total de lugares</span>
              <strong>50</strong>
            </li>
            <li>
              <span>Lugares libres</span>
              <strong id="totalFree">0</strong>
            </li>
            <li>
              <span>Lugares ocupados</span>
              <strong id="totalOccupied">0</strong>
            </li>
          </ul>

          <div class="parking-actions">
            <button id="occupyButton" class="btn btn-primary" type="button" disabled>Marcar como ocupado</button>
            <button id="leaveButton" class="btn btn-outline-primary" type="button" disabled>Retirar mi cajón</button>
            <button id="clearSelectionButton" class="btn btn-secondary" type="button">Deseleccionar</button>
          </div>
        </div>
      </div>
    </main>

    <script src="assets/js/parking.js" defer></script>
  </body>
</html>
