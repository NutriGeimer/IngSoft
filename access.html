<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BeeParking | Validando acceso</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <script id="tailwind-config">
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        "primary":           "#785900",
                        "primary-container": "#ffc107",
                        "on-primary-container": "#6d5100",
                        "background":        "#f9f9f9",
                        "on-background":     "#1a1c1c",
                        "on-surface-variant":"#4f4632",
                        "outline-variant":   "#d4c5ab",
                        "surface-container-high": "#e8e8e8",
                    },
                    fontFamily: { sans: ["Inter"] }
                }
            }
        }
    </script>
    <style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
</head>
<body class="bg-background font-sans text-on-background min-h-screen flex flex-col">

    <!-- TopAppBar -->
    <header class="sticky top-0 w-full z-50 flex items-center px-8 h-16 bg-white border-b border-slate-200 shadow-sm">
        <span class="text-xl font-black tracking-tighter text-slate-900">BeeParking</span>
    </header>

    <!-- Main -->
    <main class="flex-1 flex items-center justify-center p-8">
        <div class="bg-white rounded-2xl shadow-lg border border-outline-variant max-w-sm w-full p-8 text-center">

            <!-- Estado: cargando -->
            <div id="stateLoading">
                <div class="w-16 h-16 rounded-full bg-amber-100 flex items-center justify-center mx-auto mb-4 animate-pulse">
                    <span class="material-symbols-outlined text-3xl text-amber-600">qr_code_scanner</span>
                </div>
                <h2 class="text-xl font-bold text-slate-800 mb-2">Validando acceso</h2>
                <p class="text-sm text-slate-500">Verificando tu código QR...</p>
            </div>

            <!-- Estado: acceso válido -->
            <div id="stateSuccess" class="hidden">
                <div class="w-16 h-16 rounded-full bg-green-100 flex items-center justify-center mx-auto mb-4">
                    <span class="material-symbols-outlined text-3xl text-green-600"
                          style="font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;">
                        check_circle
                    </span>
                </div>
                <h2 class="text-xl font-bold text-slate-800 mb-1">Acceso válido</h2>
                <p class="text-sm text-slate-500 mb-4">Tu cajón asignado es</p>
                <div class="inline-block bg-amber-100 text-amber-800 font-black text-4xl rounded-xl px-8 py-4 mb-5">
                    #<span id="spotNumber">–</span>
                </div>
                <p class="text-sm text-slate-400 flex items-center justify-center gap-1">
                    <span class="material-symbols-outlined text-base">navigate_next</span>
                    Redirigiendo al mapa...
                </p>
            </div>

            <!-- Estado: error -->
            <div id="stateError" class="hidden">
                <div class="w-16 h-16 rounded-full bg-red-100 flex items-center justify-center mx-auto mb-4">
                    <span class="material-symbols-outlined text-3xl text-red-600"
                          style="font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;">
                        cancel
                    </span>
                </div>
                <h2 class="text-xl font-bold text-slate-800 mb-2">Acceso inválido</h2>
                <p id="errorMsg" class="text-sm text-slate-500 mb-6">El código QR no es válido o ya fue utilizado.</p>
                <a href="dashboard.html"
                   class="inline-block px-5 py-2 bg-amber-500 hover:bg-amber-600 text-white font-semibold rounded-lg transition-colors text-sm">
                    Volver al inicio
                </a>
            </div>

        </div>
    </main>

    <script type="module" src="./assets/js/access.js"></script>
</body>
</html>
